<svg width="600" height="700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  
  <!-- App Bar -->
  <rect x="0" y="0" width="600" height="56" fill="#6200ee" rx="0"/>
  <text x="24" y="38" fill="white" font-size="20" font-weight="500">Free Uses Enable Fast Learns</text>
  
  <!-- Content Area -->
  <g transform="translate(24, 72)">
    <!-- Main Concept -->
    <text x="0" y="24" font-size="14" fill="#333" font-weight="500">Free tiers or free usage allowances in software tools and platforms</text>
    
    <text x="0" y="52" font-size="14" fill="#333" font-weight="500">Enables rapid experimentation and learning without financial barriers</text>
    
    <!-- Enabled Activities Section -->
    <text x="0" y="92" font-size="16" font-weight="600" fill="#121212">Enabled Activities:</text>
    
    <g transform="translate(16, 120)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Test features and functionalities freely</text>
    </g>
    
    <g transform="translate(16, 148)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Iterate on configurations and approaches quickly</text>
    </g>
    
    <g transform="translate(16, 176)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Validate concepts and workflows in real scenarios</text>
    </g>
    
    <g transform="translate(16, 204)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Learn from failures and successes without cost concerns</text>
    </g>
    
    <!-- Understanding Areas Section -->
    <text x="0" y="252" font-size="16" font-weight="600" fill="#121212">Understanding Areas:</text>
    
    <g transform="translate(16, 280)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Core capabilities and limitations</text>
    </g>
    
    <g transform="translate(16, 308)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Integration patterns and workflows</text>
    </g>
    
    <g transform="translate(16, 336)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Best practices and optimization techniques</text>
    </g>
    
    <g transform="translate(16, 364)">
      <circle cx="6" cy="6" r="4" fill="#6200ee"/>
      <text x="16" y="12" font-size="13" fill="#333">Troubleshooting and problem-solving approaches</text>
    </g>
    
    <!-- Outcome Section -->
    <g transform="translate(0, 412)">
      <text x="0" y="20" font-size="14" fill="#333">Reduces cycle time from hypothesis to validation</text>
      <text x="0" y="40" font-size="14" fill="#333">Fosters faster skill development and innovation across various software domains</text>
    </g>
  </g>
</svg>